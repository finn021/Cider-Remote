name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build App
      run: |
        xcodebuild -project "Cider Remote.xcodeproj" \
                   -scheme "Cider Remote" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   build

    - name: Package IPA
      run: |
        mkdir -p Payload
        
        # Copy the built app directly from Xcode's DerivedData folder
        cp -r /Users/runner/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        
        # Zip the Payload folder into the final .ipa
        zip -r CiderRemote.ipa Payload

    - name: Upload IPA Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CiderRemote-App
        path: CiderRemote.ipa
