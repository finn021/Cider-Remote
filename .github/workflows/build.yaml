name: Build iOS App

on:
  push:
    branches: [ main ] # Change this if your default branch is named 'master'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build App
      run: |
        xcodebuild -project "Cider Remote.xcodeproj" \
                   -scheme "Cider Remote" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Package into IPA Wrapper
      run: |
        mkdir -p Payload
        mv build/Release-iphoneos/*.app Payload/
        zip -r CiderRemote.ipa Payload

    - name: Upload IPA Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CiderRemote-App
        path: CiderRemote.ipa
